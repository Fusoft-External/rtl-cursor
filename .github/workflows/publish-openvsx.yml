name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Open VSX after validation (disable for a build-only check)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: openvsx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-vsix.yml

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: openvsx
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rtl-cursor-${{ needs.build.outputs.version }}
          path: release-assets
      - name: Verify built assets and reject an existing registry version
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          node .github/scripts/openvsx-version.cjs check
      - name: Install locked publishing tools
        run: npm ci --prefix .github/ci --no-audit --no-fund
      - name: Publish the validated VSIX with OIDC
        run: node .github/ci/node_modules/ovsx/bin/ovsx publish "release-assets/rtl-cursor-$RELEASE_VERSION.vsix" --trusted-publishing
      - name: Verify the registry download matches this build
        run: node .github/scripts/openvsx-version.cjs verify "release-assets/rtl-cursor-$RELEASE_VERSION.vsix"
